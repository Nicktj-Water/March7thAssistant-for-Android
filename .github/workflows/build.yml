name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      code_tag:
        description: "March7thAssistant 源码 tag（留空 = 自动取最新 Release）"
        required: false
        default: ""

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager | sort | tail -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[5-9]|build-tools;3[5-9]" | tail -10 || true
          # API 37 目前只在 canary 频道；失败则退回 36 并同步改 compileSdk
          if ! "$SDKM" --install "platforms;android-37" --channel=3; then
            "$SDKM" --install "platforms;android-36"
            sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          fi
          for bt in "build-tools;37.0.0" "build-tools;36.0.0"; do
            "$SDKM" --install "$bt" --channel=3 && break
            "$SDKM" --install "$bt" && break
          done
          ls "$SDK/platforms" "$SDK/build-tools"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        run: python -m pip install --upgrade pip zstandard

      - name: 生成 Termux bootstrap（并重打包名 com.m7ahsr）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_bootstrap.py --download-apk
          python scripts/reprefix_bootstrap.py app/src/main/assets/bootstrap/termux-bootstrap.zip --in-place --new com.m7ahsr
          ls -lh app/src/main/assets/bootstrap/

      - name: 拉取并裁剪容器镜像
        run: |
          python scripts/pull_image.py
          python scripts/assemble_rootfs.py --strip /m7a --strip-openvino
          ls -lh app/src/main/assets/rootfs/

      - name: 打包 M7A 源码
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/make_code_zip.py --download "${{ inputs.code_tag || 'latest' }}"
          ls -lh app/src/main/assets/code/

      - name: Gradle 构建
        run: |
          chmod +x gradlew
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "===== Gradle attempt $attempt ====="
            if ./gradlew :app:assembleRelease --no-daemon --stacktrace \
                 -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed"
            if [ "$attempt" -eq 2 ]; then
              echo "切换到腾讯 Gradle 镜像后重试"
              python3 - <<'PY'
          p = "gradle/wrapper/gradle-wrapper.properties"
          s = open(p, encoding="utf-8").read()
          s = s.replace("services.gradle.org/distributions/",
                        "mirrors.cloud.tencent.com/gradle/")
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
          exit 1

      - name: 校验产物
        id: apk
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"
          cp "$APK" m7a-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: m7a-android-apk
          path: m7a-android.apk
          compression-level: 0
          retention-days: 30

      - name: 发布 Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "M7A APK #${{ github.run_number }}"
          body: |
            自动构建产物。
            - App version: 2.0.0
            - M7A code: `${{ inputs.code_tag || 'latest' }}`
            - Commit: `${{ github.sha }}`
          files: m7a-android.apk
          generate_release_notes: false
